# docker-compose.yml

version: '3.8'

services:
  web:
    build: .
    command: gunicorn algomania.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - redis

  redis:
    image: redis:latest

  celery:
    build: .
    command: celery -A algomania worker --loglevel=info
    depends_on:
      - redis

  beat:
    build: .
    command: celery -A algomania beat --loglevel=info
    depends_on:
      - redis
